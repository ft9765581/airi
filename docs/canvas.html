<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIRI 多用户后端设计</title>
<style>.card .chrome{display:none}.wtitle .idx{display:none}</style>
<style id="skinsheet">/* Pin & Paper — handmade pinboard: yellow paper ground, ink-blue hand script, pinned notes / taped slips / kraft blocks */
:root {
  --surface:#f8f1d6; --page:#efe56a; --ink:#1f3a8a; --ink-2:#2d4fb8;
  --muted:#7d86ad; --grid:#e0d494; --wash:#f5eca0; --ring:rgba(31,58,138,.28);
  --accent-a:#2d4fb8; --accent-b:#a3552e; --accent-c:#8a6a2e; --accent-d:#c2452e; --positive:#3e7d4e;
  --kraft:#c9a66b; --shadow-soft:rgba(90,70,10,.22);
  --mermaid-bg:#fdfaef; --backdrop:rgba(60,50,10,.5);
  --hand:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive,system-ui;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface:#262214; --page:#171509; --ink:#e8e0bf; --ink-2:#c2b98f;
    --muted:#857d5c; --grid:#3a3520; --wash:#2e2a18; --ring:rgba(232,224,191,.16);
    --accent-a:#8fa3e8; --accent-b:#d08a5a; --accent-c:#c9a66b; --accent-d:#e07a63; --positive:#6da97c;
    --kraft:#3a3222; --shadow-soft:rgba(0,0,0,.45);
    --mermaid-bg:#2e2a18; --backdrop:rgba(0,0,0,.6);
  }
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; overflow:hidden; }
body { background:var(--page); color:var(--ink); font:14px/1.6 var(--hand); }
#bar { position:fixed; inset:0 0 auto 0; z-index:20; display:flex; gap:14px;
  align-items:center; flex-wrap:wrap; padding:10px 18px 8px;
  background:color-mix(in srgb, var(--page) 88%, var(--surface) 12%);
  border-bottom:2px solid var(--ink); }
#bar h1 { font-size:19px; font-weight:700; margin:0 8px 0 0; position:relative; }
#bar h1::after { content:""; position:absolute; left:2px; right:18%; bottom:-3px;
  height:3px; background:var(--ink); transform:rotate(-1deg); border-radius:2px; }
.strip { font:inherit; font-size:13.5px; color:var(--ink); background:var(--surface);
  border:1.5px solid var(--ink); border-radius:2px; padding:4px 14px; cursor:pointer;
  box-shadow:0 2px 5px var(--ring); position:relative; }
.strip:nth-child(odd) { transform:rotate(-1.1deg); }
.strip:nth-child(even) { transform:rotate(.9deg); }
.strip.on { transform:rotate(0); font-weight:700; }
.strip.on::before { content:""; position:absolute; top:-5px; left:50%; width:9px;
  height:9px; margin-left:-4px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e8c67a, #9a6f2a); }
.strip:focus-visible { outline:none; box-shadow:0 0 0 2px var(--ring); }
#modes { display:flex; gap:10px; }
#q { margin-left:auto; font:inherit; color:var(--ink); background:var(--surface);
  border:1.5px solid var(--ink); border-radius:2px; padding:5px 12px; width:230px;
  transform:rotate(.4deg); }
#q::placeholder { color:var(--muted); }
#q:focus-visible { outline:none; box-shadow:0 0 0 2px var(--ring); }
#hint { width:100%; color:var(--ink-2); font-size:12px; margin:-2px 0 0; }
#chips { position:fixed; top:86px; left:0; right:0; z-index:19;
  display:flex; flex-direction:column; gap:5px; padding:8px 18px 6px;
  mask-image:linear-gradient(#000 92%, transparent); }
.chiprow { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
.rowlab { font-size:12.5px; font-weight:700; color:var(--ink); min-width:96px;
  position:relative; }
.rowlab::after { content:""; position:absolute; left:0; right:26%; bottom:-2px;
  height:2px; background:var(--ink-2); transform:rotate(-1.2deg); border-radius:2px; }
.chip { font:inherit; font-size:12px; color:var(--ink); background:var(--wash);
  border:1.3px dashed var(--ink-2); border-radius:2px; padding:2px 10px;
  cursor:pointer; }
.chip:nth-child(3n) { transform:rotate(-.8deg); }
.chip:nth-child(3n+1) { transform:rotate(.7deg); }
.chip.on { background:var(--ink); color:var(--page); border-style:solid;
  transform:rotate(0); font-weight:700; }
#vp { position:absolute; inset:0; cursor:grab; overflow:hidden; }
#vp.panning { cursor:grabbing; }
#world { position:absolute; left:0; top:0; transform-origin:0 0; }
#edgeSvg { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
.wtitle { position:absolute; pointer-events:none; white-space:nowrap;
  transform:rotate(-.5deg); }
.wtitle::after { content:""; display:block; width:340px; height:6px;
  background:var(--ink); border-radius:4px; transform:rotate(-.8deg);
  margin-top:2px; }
.wtitle .en { font-size:100px; font-weight:800; letter-spacing:.06em; color:var(--ink);
  opacity:.9; }
.wtitle .zh { font-size:46px; margin-left:26px; color:var(--ink-2); }
.glabel { position:absolute; pointer-events:none; font-size:26px; font-weight:700;
  color:var(--ink); white-space:nowrap; transform:rotate(-.6deg); }
.glabel i { font-style:normal; font-size:17px; color:var(--ink-2); margin-left:8px; }
.glabel::after { content:""; position:absolute; left:1px; right:-4px; bottom:-2px;
  height:3px; background:var(--ink); transform:rotate(-1deg); border-radius:2px; }
.card { position:absolute; padding:12px 13px 10px; cursor:pointer;
  font-size:13px; line-height:1.45; color:var(--ink); }
.card .t { font-weight:700; font-size:14px; margin:0 0 5px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card .sum { color:var(--ink-2); font-size:11.5px; margin:0;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.card .badge { position:absolute; right:8px; top:6px; font-size:10px; color:var(--ink-2); }
.card .badge + .t { margin-top:12px; }
.card.note { background:var(--surface); border:1px solid var(--ring);
  border-radius:3px; box-shadow:0 6px 12px var(--shadow-soft); }
.card.note::before { content:""; position:absolute; top:-6px; left:50%; width:11px;
  height:11px; margin-left:-5px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e8c67a, #9a6f2a);
  box-shadow:0 2px 3px var(--ring); }
.card.slip { background:var(--wash); border:2px dashed var(--ink); border-radius:4px; }
.card.kraft { background:var(--kraft); border:2px solid var(--ink); border-radius:2px;
  box-shadow:3px 4px 0 color-mix(in srgb, var(--ink) 25%, transparent); }
.card.empty { background:transparent; border:2px dashed var(--muted);
  color:var(--muted); border-radius:3px; }
.card.empty .t, .card.empty .sum { color:var(--ink-2); opacity:.75; }
.card.dim { opacity:.14; }
.card.sel { outline:3px solid var(--ink); outline-offset:2px; box-shadow:none; }
.card.nb { outline:2.5px dashed var(--accent-d); outline-offset:2px; }
[data-tier="bird"] .card .t, [data-tier="bird"] .card .sum,
[data-tier="bird"] .card .badge { visibility:hidden; }
[data-tier="bird"] .card.note { background:var(--surface); }
[data-tier="bird"] .card.slip { background:var(--accent-b); }
[data-tier="bird"] .card.kraft { background:var(--accent-c); }
[data-tier="mid"] .card .sum { visibility:hidden; }
[data-tier="mid"] .card .t { -webkit-line-clamp:3; font-size:17px; }
dialog { font:14px/1.6 var(--hand); background:var(--surface); color:var(--ink);
  border:2px solid var(--ink); border-radius:3px; padding:0;
  width:min(1060px,94vw); max-height:88vh; box-shadow:8px 8px 0 var(--ring); }
dialog::backdrop { background:var(--backdrop); }
.dlg { display:grid; grid-template-columns:280px 1fr; max-height:88vh; }
@media (max-width:760px) { .dlg { grid-template-columns:1fr; } }
.rail { border-right:2px dashed var(--ink-2); padding:20px 18px; overflow-y:auto;
  background:var(--wash); }
.rail h3 { margin:0 0 3px; font-size:14px; font-weight:700; }
.rail .hint { color:var(--muted); font-size:12px; margin:0 0 14px; }
.rail a.node { display:block; text-decoration:none; color:var(--ink);
  background:var(--surface); border:1.3px solid var(--ink-2); border-radius:2px;
  padding:5px 10px; margin-bottom:7px; font-size:12.5px; transform:rotate(-.4deg); }
.rail a.node:nth-child(odd) { transform:rotate(.5deg); }
.rail .sect { font-weight:700; color:var(--ink-2); margin:12px 0 6px; font-size:12.5px; }
.content { padding:22px 26px 26px; overflow-y:auto; }
.content .top { display:flex; gap:10px; align-items:baseline; margin-bottom:6px; }
.content .top .badge { font-size:11.5px; color:var(--ink-2); border:1.3px solid var(--ink-2);
  border-radius:2px; padding:1px 9px; background:var(--wash); }
.content .top button { margin-left:auto; font:inherit; background:none;
  border:1.5px solid var(--ink); border-radius:2px; color:var(--ink);
  cursor:pointer; padding:3px 12px; }
.md { font-size:14px; }
.md h1 { font-size:19px; margin:.3em 0 .5em; font-weight:700; }
.md h2 { font-size:16px; margin:1.2em 0 .4em; font-weight:700; }
.md p, .md li { max-width:74ch; }
.md a { color:var(--accent-a); }
.md table { border-collapse:collapse; font-size:13px; display:block; overflow-x:auto; }
.md th, .md td { border:1.3px solid var(--ink-2); padding:5px 10px; text-align:left; }
.md th { background:var(--wash); }
.md code { background:var(--wash); border-radius:2px; padding:1px 5px; font-size:12.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
.md pre { background:var(--wash); border:1.3px dashed var(--ink-2); border-radius:3px;
  padding:12px 14px; overflow-x:auto; }
.md blockquote { border-left:3px solid var(--ink-2); margin:0; padding:2px 14px;
  color:var(--ink-2); }
.md .mermaid { display:flex; justify-content:center; overflow-x:auto;
  background:var(--mermaid-bg); border:1.3px solid var(--grid); border-radius:3px; padding:10px;
  cursor:zoom-in; position:relative; }
.md .mermaid:hover { border-color:var(--ink-2); }
.md .mermaid svg[aria-roledescription="block"] .nodeLabel,
.md .mermaid svg[aria-roledescription="block"] span {
  color:var(--ink) !important; font-family:var(--hand); }
.md .mermaid g.blk-link { cursor:pointer; }
.md .mermaid g.blk-link:hover rect { stroke-width:3.2px; }
dialog#zoom { border:none; padding:0; margin:0; width:100vw; height:100vh;
  max-width:100vw; max-height:100vh; background:var(--backdrop); box-shadow:none; }
dialog#zoom::backdrop { background:transparent; }
#zoom .stage { position:absolute; inset:0; overflow:hidden; cursor:grab; }
#zoom .inner { position:absolute; left:0; top:0; transform-origin:0 0; }
#zoom .inner svg { background:var(--mermaid-bg); border:2px solid var(--ink); border-radius:4px;
  box-shadow:10px 10px 0 var(--ring); }
#zoom .tip { position:absolute; top:14px; left:50%; transform:translateX(-50%);
  background:var(--surface); border:1.5px solid var(--ink); border-radius:2px;
  color:var(--ink); font-size:13px; padding:4px 16px; z-index:2; }
@media (prefers-reduced-motion: reduce) { #world { transition:none !important; } }
#skin { font:inherit; color:var(--ink); background:var(--surface); border:1.5px solid var(--ink); border-radius:2px; padding:5px 12px; cursor:pointer; }
</style>
<div id="bar">
  <h1>AIRI 多用户后端设计</h1>
  <input id="q" type="search" placeholder="Search titles or summaries, Enter to fly there…" aria-label="Search">
  <select id="skin" aria-label="Style"></select>
  <div id="hint">Scroll to zoom · drag to pan · click to light neighbors · double-click for detail · Esc to clear</div>
</div>
<div id="chips"></div>
<div id="vp"><div id="world">
  <svg id="edgeSvg"></svg>
</div></div>
<dialog id="zoom"><div class="tip">Scroll to zoom · drag to pan · click blank or Esc to close</div><div class="stage"><div class="inner"></div></div></dialog>
<dialog id="dlg"><div class="dlg">
  <aside class="rail" id="rail"></aside>
  <section class="content" id="content"></section>
</div></dialog>

README.md`](../../../../server/apps/api/README.md)。", "sources\\repository\\identity-and-chat.md": "# 现有 API 已按用户身份执行聊天和配置访问控制\n\nAuth 服务签发 OIDC JWT。资源 API 本地校验令牌，并把用户身份写入 Hono 上下文。聊天服务通过 `chat_members` 校验成员资格。用户 Provider 配置使用 `owner_id` 隔离。WebSocket v2 在连接建立后完成认证。新增知识库和 MCP 数据可以沿用相同的身份解析与服务层授权方式。来源：[`request-auth.ts`](../../../../server/apps/api/src/libs/request-auth.ts)、[`chats.ts`](../../../../server/apps/api/src/services/domain/chats.ts)、[`providers.ts`](../../../../server/apps/api/src/schemas/providers.ts)、[`auth.ts`](../../../../server/apps/auth/src/auth.ts)。", "sources\\repository\\knowledge-base.md": "# 知识库已有检索契约和 BM25 原型，但没有多用户数据模型\n\n共享 UI 已支持 Dify 外部知识库检索契约。`medical-kb` 原型可读取 Markdown 和文本文件，并在内存中建立 BM25 索引。该原型只使用一个全局 API Key，目录名直接充当知识库 ID。它没有用户身份、文档元数据、持久化索引、增量更新或删除流程。来源：[`knowledge-base.ts`](../../../../packages/stage-ui/src/libs/knowledge-base.ts)、[`README.md`](../../../../medical-kb/README.md)、[`kb_server.py`](../../../../medical-kb/kb_server.py)。", "sources\\repository\\mcp-runtime.md": "# MCP 当前由 Electron 本地运行时提供，后端没有用户级 MCP Broker\n\n桌面端把 `mcp.json` 中的 `stdio` 服务器交给 Electron 主进程。共享 UI 只依赖 `listTools` 和 `callTool` 两个运行时方法。仓库还包含基于官方 TypeScript SDK 的 `computer-use-mcp` 服务，但该服务本身是 MCP Server，不负责保存用户连接或代理远程 MCP Server。后端可以复用共享 UI 的抽象，但必须新增用户级连接、密钥、工具缓存和调用策略。来源：[`mcp.ts`](../../../../packages/stage-ui/src/tools/mcp.ts)、[`mcp-config.ts`](../../../../apps/stage-tamagotchi/src/shared/mcp-config.ts)、[`server.ts`](../../../../services/computer-use-mcp/src/server.ts)。", "sources\\repository\\vector-storage.md": "# PostgreSQL 已启用向量扩展，但现有 memory-pgvector 包尚未实现存储\n\n开发数据库使用带向量能力的 PostgreSQL 镜像，并在初始化时创建 `vchord` 扩展。API 也已依赖 PGlite 的向量扩展。`packages/memory-pgvector` 目前只有连接骨架，没有数据表或检索逻辑。知识库可以直接使用现有 PostgreSQL，而不引入独立向量数据库。来源：[`init.sql`](../../../../server/apps/api/sql/init.sql)、[`docker-compose.yaml`](../../../../server/docker-compose.yaml)、[`index.ts`](../../../../packages/memory-pgvector/src/index.ts)。", "ideas\\remote-mcp-only.md": "# 托管后端首版只连接远程 Streamable HTTP MCP Server\n\n云端不能安全地为普通用户启动任意 `stdio` 命令。Electron 继续管理本地 `stdio` MCP。后端只代理远程 MCP，并复用共享 UI 的工具发现与调用抽象。该判断基于[当前 MCP 运行方式](../sources/repository/mcp-runtime.md)。", "ideas\\extend-resource-api.md": "# 首版把 MCP Broker 和知识库放进现有资源 API\n\n用户要求首版尽量简单。现有资源 API 已拥有身份、数据库、Redis、迁移和运行监控，因此首版不增加微服务。这个判断基于[现有后端边界](../sources/repository/hosted-backend.md)。", "ideas\\postgres-knowledge-base.md": "# 首版知识库只使用 PostgreSQL，并限制文档格式\n\n首版接受纯文本、Markdown 和粘贴文本。API 保存文档正文、分块和向量，并提供关键词与向量检索。PDF、网页抓取和独立对象存储进入后续阶段。该判断基于[知识库原型](../sources/repository/knowledge-base.md)与[现有向量存储能力](../sources/repository/vector-storage.md)。", "ideas\\owner-scoped-data.md": "# 每个新增业务对象必须有明确的用户所有者\n\n知识库、文档、MCP 连接和调用记录必须从认证上下文取得 `owner_id`。客户端不能提交或覆盖所有者字段。该判断满足多用户要求，并沿用[现有身份与聊天访问控制](../sources/repository/identity-and-chat.md)。"}, "edges": [{"from": "ideas\\extend-resource-api.md", "to": "sources\\repository\\hosted-backend.md"}, {"from": "ideas\\owner-scoped-data.md", "to": "sources\\repository\\identity-and-chat.md"}, {"from": "ideas\\postgres-knowledge-base.md", "to": "sources\\repository\\knowledge-base.md"}, {"from": "ideas\\postgres-knowledge-base.md", "to": "sources\\repository\\vector-storage.md"}, {"from": "ideas\\remote-mcp-only.md", "to": "sources\\repository\\mcp-runtime.md"}], "labels": [{"x": 16, "y": 0, "t": "现状", "n": 5}, {"x": 1586, "y": 0, "t": "MCP", "n": 1}, {"x": 1916, "y": 0, "t": "架构", "n": 1}, {"x": 2246, "y": 0, "t": "知识库", "n": 1}, {"x": 2576, "y": 0, "t": "隔离", "n": 1}, {"x": 3280, "y": 0, "t": "output — assembled artifacts", "n": 9}, {"x": 1648, "y": 1198, "t": "board documents", "n": 1}], "worlds": [{"x": 0, "y": -230, "w": 1150, "zh": "Evidence", "en": "WORLD 1 · SOURCES"}, {"x": 1570, "y": -230, "w": 1274, "zh": "Ideas", "en": "WORLD 2 · IDEAS"}, {"x": 3264, "y": -230, "w": 1150, "zh": "Assembly", "en": "WORLD 3 · OUTPUT"}, {"x": 1632, "y": 968, "w": 1150, "zh": "Free surface", "en": "BOARD"}], "output": {"output\\file-structure.md": "# 建议文件结构\n\n```text\nserver/apps/api/src/\n├── routes/\n│   ├── knowledge-bases/       # 知识库、文档、检索 HTTP 契约\n│   └── mcp-connections/       # MCP 连接、工具发现和调用 HTTP 契约\n├── schemas/\n│   ├── knowledge-base.ts      # 知识库、文档、片段和任务表\n│   └── mcp.ts                 # MCP 连接、工具缓存和审计表\n├── services/\n│   ├── adapters/\n│   │   ├── embeddings/        # OpenAI 兼容 embedding 边界\n│   │   └── mcp-client/        # 官方 SDK、传输、SSRF 与超时策略\n│   └── domain/\n│       ├── knowledge-base/    # 所有权、文档生命周期、分块和检索\n│       └── mcp/               # 连接生命周期、工具策略和调用审计\n└── workers/\n    └── knowledge-indexer/     # 数据库租约、重试和索引任务\n\npackages/stage-ui/src/\n├── libs/knowledge-base.ts     # 保留 Dify 外部知识库适配器\n└── tools/mcp.ts               # 复用 listTools/callTool 运行时契约\n```\n\n# 模块到文件\n\n| 模块 | 主要落点 |\n| --- | --- |\n| [身份与访问控制](modules/identity-and-access.md) | 现有 `middlewares/auth.ts` 与各域服务所有权检查 |\n| [API 编排](modules/api-orchestration.md) | `app.ts`、两个新路由目录 |\n| [MCP Broker](modules/mcp-runtime.md) | `services/adapters/mcp-client`、`services/domain/mcp` |\n| [知识库](modules/knowledge-base.md) | `services/domain/knowledge-base`、`workers/knowledge-indexer` |\n| [数据模型](modules/data-model.md) | `schemas/knowledge-base.ts`、`schemas/mcp.ts`、Drizzle 迁移 |\n| [部署与运行](modules/deployment.md) | `app.ts`、`server.ts`、环境变量和现有 compose 配置 |\n", "output\\implementation-plan.md": "# 实施顺序\n\n| 阶段 | 工作 | 完成标准 |\n| --- | --- | --- |\n| 1. 所有权骨架 | 新增知识库与 MCP 表、迁移、Valibot 契约、账户删除清理 | 两个用户不能读取、修改或删除对方资源；删除账户无残留密钥 |\n| 2. 知识库 MVP | 文本与 Markdown 写入、分块、数据库任务、全文检索 | 文档更新可重建索引；失败任务可重试；检索始终限制用户与知识库 |\n| 3. MCP MVP | 远程 HTTP 连接、工具发现、允许列表、工具调用、审计 | SSRF 用例被拒绝；密钥不出现在响应和日志；调用可取消和超时 |\n| 4. 对话接入 | 为现有 `McpToolRuntime` 增加托管实现；聊天检索托管知识库 | Web 与 Electron 登录后可使用同一托管知识库和远程 MCP |\n| 5. 向量检索 | 增加 embedding Adapter、向量列、重建任务和混合排序 | 模型版本固定；重建可恢复；无 embedding 时全文检索仍可用 |\n| 6. 运行加固 | 限流、配额、指标、租约恢复、审计保留与负载测试 | 多 API 实例不重复处理任务；外部故障不会阻止健康检查 |\n\n# 首版明确不做\n\n- 不提供组织、团队、角色和共享知识库。\n- 不在服务器执行用户提供的 MCP `stdio` 命令。\n- 不支持 PDF、Office、网页抓取和 OCR。\n- 不新增独立向量数据库、对象存储或消息队列。\n- 不把完整 MCP 参数、结果或文档正文写入普通日志。\n\n# 必须保留的测试\n\n- 每个资源 API 都有双用户隔离回归测试。\n- 知识库任务覆盖重复执行、旧版本任务、租约过期和删除竞态。\n- MCP Adapter 覆盖私网地址、重定向、DNS 重绑定、超时、取消和超大响应。\n- 账户删除覆盖文档、片段、任务、MCP 密钥和审计记录。\n- 多实例测试证明一个任务只提交一次最终索引结果。\n", "output\\modules\\api-orchestration.md": "# API 编排\n\n- 继续使用 `server/apps/api` 作为业务入口，并使用 Hono、Valibot、Drizzle 和 `injeca`。\n- 新增 `/api/v1/knowledge-bases/*` 与 `/api/v1/mcp-connections/*` 路由。\n- LLM 工具循环可以继续运行在客户端。客户端通过认证 API 取得知识片段和调用 MCP 工具。\n- 如果后续把对话编排移到服务端，这两个域服务保持不变。服务端编排只替换调用者。\n- 所有外部响应、MCP 内容和任务载荷都通过 Valibot 校验。\n- 每次请求生成追踪 ID。日志记录用户 ID、资源 ID、MCP Server ID 和耗时，但不记录密钥或完整文档。\n- 单次对话限制知识片段数量、片段总字符数、MCP 工具次数和总执行时间。\n- MCP 工具结果经过长度限制后才进入模型上下文。超出部分保存摘要或返回截断标记。\n\n依据：[模块化单体决策](../../ideas/extend-resource-api.md)、[现有后端边界](../../sources/repository/hosted-backend.md)。\n", "output\\modules\\data-model.md": "# 数据模型\n\n| 表 | 关键字段 | 约束与索引 |\n| --- | --- | --- |\n| `knowledge_bases` | `id`, `owner_id`, `name`, `retrieval_mode`, `created_at`, `deleted_at` | `(owner_id, id)`；名称可按用户唯一 |\n| `knowledge_documents` | `id`, `owner_id`, `knowledge_base_id`, `name`, `content`, `content_hash`, `status`, `version` | `(owner_id, knowledge_base_id)`；父表级联删除 |\n| `knowledge_chunks` | `id`, `owner_id`, `knowledge_base_id`, `document_id`, `position`, `content`, `search_vector`, `embedding` | GIN 全文索引；向量索引；`(owner_id, knowledge_base_id)` |\n| `knowledge_jobs` | `id`, `owner_id`, `document_id`, `kind`, `status`, `attempts`, `available_at`, `lease_until`, `error_code` | `(status, available_at)`；文档版本用于幂等 |\n| `mcp_connections` | `id`, `owner_id`, `name`, `url`, `auth_type`, `encrypted_credentials`, `enabled`, `tool_policy`, `updated_at` | `(owner_id, id)`；URL 不保存内嵌凭据 |\n| `mcp_tool_cache` | `connection_id`, `tool_name`, `description`, `input_schema`, `discovered_at` | `(connection_id, tool_name)` 唯一；连接删除时级联 |\n| `mcp_call_audit` | `id`, `owner_id`, `connection_id`, `tool_name`, `status`, `duration_ms`, `error_code`, `created_at` | `(owner_id, created_at)`；设置保留期限 |\n\n## 不变量\n\n- 子表冗余保存 `owner_id`。所有查询必须同时匹配所有者和父资源。\n- API 不接受客户端指定的 `owner_id`。\n- 文档版本进入任务载荷。旧版本任务完成时不能覆盖新版本状态。\n- MCP 凭据只在调用时解密。API 响应永远返回凭据是否存在，不返回凭据内容。\n- embedding 维度由部署配置固定。不同维度不能写入同一索引。\n\n依据：[用户所有权决策](../../ideas/owner-scoped-data.md)、[PostgreSQL 知识库决策](../../ideas/postgres-knowledge-base.md)。\n", "output\\modules\\deployment.md": "# 部署与运行\n\n- 保持现有五个本地容器：Caddy、API、Auth、PostgreSQL 和 Redis。\n- 不新增向量数据库、消息队列、对象存储或独立 Worker 容器。\n- API 进程启动一个受并发限制的知识库任务循环。`KNOWLEDGE_WORKER_ENABLED` 可以关闭该循环。\n- Railway 多实例通过数据库租约分配任务。实例退出后，过期租约允许其他实例重试。\n- Redis 只保存 MCP 工具短期缓存、限流计数和跨实例失效通知。PostgreSQL 保存真实状态。\n- 新增环境变量只包含 embedding Provider、模型、维度、任务并发和 MCP 出站策略。\n- `/readyz` 检查 PostgreSQL、Redis 和迁移状态。外部 MCP 与 embedding Provider 不阻止 API 就绪。\n- OpenTelemetry 记录索引队列深度、索引耗时、检索耗时、MCP 调用状态和外部依赖错误。\n- 当索引工作明显影响 API 延迟时，把同一任务执行器移入独立 Worker。数据库任务契约保持不变。\n\n依据：[模块化单体决策](../../ideas/extend-resource-api.md)、[现有部署](../../sources/repository/hosted-backend.md)。\n", "output\\modules\\identity-and-access.md": "# 身份与访问控制\n\n- Auth 服务继续负责注册、登录、会话、OIDC 和账户删除。\n- 资源 API 继续本地校验 OIDC JWT。业务路由只读取认证上下文中的 `user.id`。\n- `knowledge_bases`、`knowledge_documents`、`mcp_connections` 和调用审计记录都保存 `owner_id`。\n- 创建操作忽略请求中的所有者字段。服务层使用当前用户 ID 写入所有者。\n- 读取、修改和删除操作同时匹配资源 ID 与 `owner_id`。不存在和无权限统一返回 `404`。\n- 聊天共享继续使用 `chat_members`。首版知识库和 MCP 连接不支持跨用户共享。\n- 账户删除先通过现有私有接口删除知识库、分块、MCP 密钥和调用记录，再删除 Auth 数据。\n- API Key、MCP Bearer Token 和 OAuth Refresh Token 使用现有 Envelope Crypto 加密后保存。\n- 数据库索引必须以 `owner_id` 开头，防止跨用户列表和检索退化为全表扫描。\n\n依据：[用户所有权决策](../../ideas/owner-scoped-data.md)、[现有身份实现](../../sources/repository/identity-and-chat.md)。\n", "output\\modules\\knowledge-base.md": "# 知识库\n\n- 首版支持粘贴文本、`.txt` 和 `.md`。API 在上传请求中提取 UTF-8 正文。\n- `knowledge_bases` 保存用户可见名称、检索配置和索引状态。\n- `knowledge_documents` 保存文档名、正文哈希、正文、版本和处理状态。\n- `knowledge_chunks` 保存片段文本、标题、顺序、全文检索向量和 embedding。\n- 文档写入与索引任务在一个事务中提交。任务失败不会丢失文档。\n- 进程内 Worker 从 `knowledge_jobs` 认领任务。它使用 `FOR UPDATE SKIP LOCKED` 防止多实例重复执行。\n- Worker 按标题和段落切分文本。默认片段约 500 至 800 tokens，并保留少量重叠。\n- 一个部署环境只使用一个 embedding 模型和固定向量维度。模型变更触发显式重建。\n- 检索先限制 `owner_id` 与 `knowledge_base_id`，再执行全文或向量查询。\n- 首版可以先上线 PostgreSQL 全文检索。启用 embedding 后使用 Reciprocal Rank Fusion 合并两组结果。\n- API 返回片段内容、文档名、分数和定位信息。聊天层负责控制注入上下文的总长度。\n- 删除知识库时级联删除文档、片段和任务。账户删除调用同一个域服务。\n- 保留现有 Dify 请求适配器，但托管知识库使用认证后的内部 API，避免把用户 API Key 暴露给浏览器。\n\n依据：[PostgreSQL 知识库决策](../../ideas/postgres-knowledge-base.md)、[知识库原型](../../sources/repository/knowledge-base.md)、[向量存储现状](../../sources/repository/vector-storage.md)。\n", "output\\modules\\mcp-runtime.md": "# MCP Broker\n\n- 首版只支持远程 Streamable HTTP。Electron 的本地 `stdio` MCP 保持现状。\n- 使用仓库已有的 `@modelcontextprotocol/sdk` 创建短生命周期 MCP Client。\n- `mcp_connections` 保存名称、URL、认证方式、加密凭据、启用状态和工具策略。\n- `POST /api/v1/mcp-connections` 创建连接。服务端先校验 URL，再执行 `initialize` 和 `tools/list`。\n- `GET /api/v1/mcp-connections/:id/tools` 返回缓存的工具描述。缓存可以按连接更新或按 TTL 失效。\n- `POST /api/v1/mcp-connections/:id/tools/:toolName/call` 调用工具。服务端再次检查所有权、启用状态和允许列表。\n- 连接 URL 只允许 `https`。开发环境可以显式允许 `http://localhost`。\n- DNS 解析后拒绝 loopback、link-local、私网和云元数据地址。每次重定向后再次检查目标地址。\n- 请求限制连接时间、总时间、响应字节数和并发数。断开客户端连接时取消上游调用。\n- 首版使用 Bearer Token 或无认证。OAuth 授权流程可在后续增加，不改变连接表的所有权模型。\n- 工具默认全部禁用，或在首次连接时由用户明确选择。高风险工具可以要求每次确认。\n- 调用审计只保存工具名、状态、耗时和错误代码。默认不保存参数与结果正文。\n\n依据：[远程 MCP 决策](../../ideas/remote-mcp-only.md)、[当前 MCP 运行方式](../../sources/repository/mcp-runtime.md)。\n", "output\\system.md": "# 用户请求流程\n\n```mermaid\nflowchart LR\n  subgraph U[用户]\n    U1[登录]\n    U2[管理知识库]\n    U3[配置远程 MCP]\n    U4[发起对话]\n  end\n  subgraph A[AIRI 后端]\n    A1[认证身份]\n    A2[写入文档并排队索引]\n    A3[校验连接并缓存工具]\n    A4[检索用户知识库]\n    A5[调用允许的 MCP 工具]\n    A6[生成并保存回答]\n  end\n  U1 --> A1\n  U2 --> A1 --> A2\n  U3 --> A1 --> A3\n  U4 --> A1 --> A4 --> A6\n  A6 -->|需要工具| A5 --> A6\n  click A1 \"modules/identity-and-access.md\"\n  click A2 \"modules/knowledge-base.md\"\n  click A3 \"modules/mcp-runtime.md\"\n  click A4 \"modules/knowledge-base.md\"\n  click A5 \"modules/mcp-runtime.md\"\n  click A6 \"modules/api-orchestration.md\"\n```\n\n# 系统架构\n\n```mermaid\nflowchart TB\n  C[Web / Electron / Mobile\u003cbr/>统一 API 客户端]\n  E[Caddy\u003cbr/>单一公开入口]\n  AU[Auth Service\u003cbr/>Better Auth 与 OIDC]\n  API[Resource API\u003cbr/>Hono 模块化单体]\n  IAM[Identity & Access\u003cbr/>用户所有权检查]\n  KB[Knowledge Base\u003cbr/>文档、分块与检索]\n  MCP[MCP Broker\u003cbr/>远程工具发现与调用]\n  JOB[Job Runner\u003cbr/>进程内可恢复任务]\n  DB[(PostgreSQL + vchord\u003cbr/>业务数据与向量)]\n  R[(Redis\u003cbr/>限流与短期缓存)]\n  RMCP[Remote MCP Servers\u003cbr/>Streamable HTTP]\n  EMB[Embedding Provider\u003cbr/>OpenAI 兼容接口]\n  C --> E\n  E --> AU\n  E --> API\n  API --> IAM\n  IAM --> KB\n  IAM --> MCP\n  KB --> JOB\n  JOB --> EMB\n  KB --> DB\n  MCP --> DB\n  MCP --> R\n  MCP --> RMCP\n  API --> R\n  AU --> DB\n  click AU \"modules/identity-and-access.md\"\n  click IAM \"modules/identity-and-access.md\"\n  click API \"modules/api-orchestration.md\"\n  click KB \"modules/knowledge-base.md\"\n  click MCP \"modules/mcp-runtime.md\"\n  click JOB \"modules/knowledge-base.md\"\n  click DB \"modules/data-model.md\"\n  click R \"modules/deployment.md\"\n  click RMCP \"modules/mcp-runtime.md\"\n  click EMB \"modules/knowledge-base.md\"\n```\n"}, "board": {"board\\backend-options.md": "# 后端简化方案比较\n\n| 决策点 | 首版方案 | 暂不采用 | 原因 |\n| --- | --- | --- | --- |\n| 服务边界 | 扩展现有资源 API | 新建 MCP、知识库和 Worker 微服务 | 现有 API 已有全部基础设施；新增服务会增加部署与一致性成本 |\n| 用户模型 | 每个资源直接使用 `owner_id` | 首版引入组织、成员和角色系统 | 当前需求是多用户，不是团队协作；直接所有权足够形成可靠隔离 |\n| MCP 传输 | 远程 Streamable HTTP | 云端运行任意 `stdio` | 远程 HTTP 可做超时、域名与网络出口控制；任意进程执行风险过高 |\n| 知识库存储 | PostgreSQL 文本、全文索引和向量 | 独立向量数据库 | 当前 PostgreSQL 已有向量扩展；单库事务能简化删除和权限检查 |\n| 后台任务 | API 内部 Worker 加数据库任务表 | Redis 队列服务 | 文档规模较小时，一个可恢复任务表已经足够；后续可保持任务契约并替换执行器 |\n| 文件格式 | 文本与 Markdown | 首版支持 PDF、Office 和网页 | 文档解析会引入较多依赖和安全面，且不影响检索核心闭环 |\n\n## 需要产品确认的后续范围\n\n- 知识库是否要多人共享。如果需要，新增 workspace 与 ACL，而不是复用 `owner_id`。\n- MCP 是否允许用户填写任意公网 URL。如果不允许，改用管理员维护的连接目录。\n- 首版是否必须处理 PDF。如果必须，文档解析应进入隔离 Worker。\n"}};
const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const ALLDOCS = Object.assign({}, DATA.output, DATA.board);
const world = document.getElementById("world");
const vp = document.getElementById("vp");
const svg = document.getElementById("edgeSvg");
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };

DATA.worlds.forEach((w, i) => {
  const d = el("div", "wtitle");
  d.style.left = w.x + "px"; d.style.top = w.y + "px";

DATA.labels.forEach(l => {
  const d = el("div", "glabel", l.t);

  d.append(i); d.style.left = l.x + "px"; d.style.top = l.y + "px";
  world.append(d);
});
const cardEls = {};
DATA.nodes.forEach((n, i) => {
  const c = el("article", "card " + n.g);
  c.style.left = n.x + "px"; c.style.top = n.y + "px";
  c.style.width = n.w + "px"; c.style.height = n.h + "px";
  c.style.transform = "rotate(" + (((i * 137) % 7 - 3) * .5) + "deg)";
  const chrome = el("span", "chrome");
  chrome.append(document.createElement("i"));
  c.append(chrome);
  const badge = (n.subtype || "") +
    (n.tags.length ? " #" + n.tags[0] : "");
  if (badge.trim()) c.append(el("span", "badge", badge.trim()));
  c.append(el("p", "t", n.title.replace(/^\[[^\]]*\]\s*/, "")));
  c.append(el("p", "sum", n.summary));
  c.dataset.id = n.id;
  world.append(c);
  cardEls[n.id] = c;
});

let sx = 0, sy = 0, scale = 1;
function apply(animate) {
  world.style.transition = animate ? "transform .45s ease" : "none";
  world.style.transform = `translate(${sx}px, ${sy}px) scale(${scale})`;
  document.body.dataset.tier = scale < .34 ? "bird" : scale < .78 ? "mid" : "close";
}
const bbox = (() => {
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  DATA.nodes.forEach(n => { x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y - 420);
    x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + n.h); });
  return { x1, y1, x2, y2 };
})();
function fitAll(animate) {
  const vw = innerWidth, vh = innerHeight - 195;
  scale = Math.min(vw / (bbox.x2 - bbox.x1 + 200), vh / (bbox.y2 - bbox.y1 + 200), 1);
  sx = (vw - (bbox.x2 - bbox.x1) * scale) / 2 - bbox.x1 * scale;
  sy = 205 + (vh - (bbox.y2 - bbox.y1) * scale) / 2 - bbox.y1 * scale;
  apply(animate);
}
function flyTo(id, target) {
  const n = byId[id]; if (!n) return;
  scale = target || .95;
  sx = innerWidth / 2 - (n.x + n.w / 2) * scale;
  sy = innerHeight / 2 - (n.y + n.h / 2) * scale;
  apply(true);
}
vp.addEventListener("wheel", e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * .0013);
  const ns = Math.min(2.2, Math.max(.05, scale * f));
  sx = e.clientX - (e.clientX - sx) * ns / scale;
  sy = e.clientY - (e.clientY - sy) * ns / scale;
  scale = ns; apply(false);
}, { passive: false });
let pan = null;
vp.addEventListener("pointerdown", e => {
  if (e.target.closest(".card")) return;
  pan = { x: e.clientX - sx, y: e.clientY - sy };
  vp.classList.add("panning"); vp.setPointerCapture(e.pointerId);
});
vp.addEventListener("pointermove", e => {
  if (!pan) return; sx = e.clientX - pan.x; sy = e.clientY - pan.y; apply(false);
});
vp.addEventListener("pointerup", () => { pan = null; vp.classList.remove("panning"); });

const outE = {}, inE = {};
DATA.edges.forEach(e => {
  (outE[e.from] = outE[e.from] || []).push(e.to);
  (inE[e.to] = inE[e.to] || []).push(e.from);
});
const SVGNS = "http://www.w3.org/2000/svg";
const conflictLayer = document.createElementNS(SVGNS, "g");
const selLayer = document.createElementNS(SVGNS, "g");
svg.append(conflictLayer, selLayer);
const CONFLICT_EDGES = DATA.edges.filter(e => e.kind === "conflict");
const conflictPairs = new Set(CONFLICT_EDGES.flatMap(e =>
  [e.from + "→" + e.to, e.to + "→" + e.from]));
const CONFLICT_STROKE = "var(--edge-conflict, #d0342c)";
function edgePath(a, b, stroke) {
  const p = document.createElementNS(SVGNS, "path");
  const x1 = a.x + a.w / 2, y1 = a.y + a.h / 2;
  const x2 = b.x + b.w / 2, y2 = b.y + b.h / 2;
  const shape = getComputedStyle(document.body)
    .getPropertyValue("--edge-shape").trim() || "curve";
  if (shape === "line") {
    p.setAttribute("d", `M${x1},${y1} L${x2},${y2}`);
  } else if (shape === "ortho") {
    const midx = (x1 + x2) / 2;
    p.setAttribute("d", `M${x1},${y1} L${midx},${y1} L${midx},${y2} L${x2},${y2}`);
  } else {
    const mx = (x1 + x2) / 2, my = Math.min(y1, y2) - 60 - Math.abs(x2 - x1) * .06;
    p.setAttribute("d", `M${x1},${y1} Q${mx},${my} ${x2},${y2}`);
  }
  p.setAttribute("fill", "none");
  p.setAttribute("stroke", stroke);
  p.setAttribute("stroke-width", "2.5");
  p.setAttribute("stroke-dasharray", "7 6");
  p.setAttribute("opacity", ".85");
  return p;
}
function drawConflicts() {
  conflictLayer.textContent = "";
  CONFLICT_EDGES.forEach(e => {
    const a = byId[e.from], b = byId[e.to];
    if (a && b) conflictLayer.append(edgePath(a, b, CONFLICT_STROKE));
  });
}
drawConflicts();
let selected = null;
function clearSel() {
  selected = null; selLayer.textContent = "";
  Object.values(cardEls).forEach(c => c.classList.remove("sel", "nb"));
}
function select(id) {
  clearSel(); selected = id;
  const me = byId[id]; if (!me) return;
  cardEls[id].classList.add("sel");
  const nbs = [...new Set([...(outE[id] || []), ...(inE[id] || [])])];
  nbs.forEach(t => {
    const n = byId[t]; if (!n) return;
    cardEls[t].classList.add("nb");
    const stroke = conflictPairs.has(id + "→" + t)
      ? CONFLICT_STROKE : "var(--ink)";
    selLayer.append(edgePath(me, n, stroke));
  });
}
world.addEventListener("click", e => {
  const c = e.target.closest(".card");
  if (!c) { clearSel(); return; }
  if (document.body.dataset.tier === "bird") {
    flyTo(c.dataset.id, .95);
    select(c.dataset.id);
    return;
  }
  select(c.dataset.id);
});
world.addEventListener("dblclick", e => {
  const c = e.target.closest(".card"); if (!c) return;
  const id = c.dataset.id;
  if (ALLDOCS[id] !== undefined) openDoc(id);
  else if (id !== "__board_empty__") openCard(id);
});
addEventListener("keydown", e => { if (e.key === "Escape" && !dlg.open) clearSel(); });

const chipsEl = document.getElementById("chips");
let activeTag = "", activeLayer = "", q = "";
const chips = [];
const ROWS = [["sources", "Evidence · World 1"], ["ideas", "Ideas · World 2"],
              ["output", "Assembly · World 3"], ["board", "Free surface"]];
const rowTop = el("div", "chiprow");

ROWS.forEach(([layer, label]) => {
  const counts = {};
  DATA.nodes.filter(n => n.layer === layer)
    .forEach(n => n.tags.forEach(t => counts[t] = (counts[t] || 0) + 1));

  const row = el("div", "chiprow");
  row.append(el("span", "rowlab", label));

    const c = el("button", "chip", "#" + t + " " + counts[t]);
    row.append(c); chips.push([c, t, layer]);
  });
  chipsEl.append(row);
});
function paint() {
  DATA.nodes.forEach(n => {
    const hit = (!activeTag || (n.tags.includes(activeTag) && n.layer === activeLayer)) &&
      (!q || (n.title + " " + n.summary + " " + n.tags.join(" "))
        .toLowerCase().includes(q));
    cardEls[n.id].classList.toggle("dim", !hit);
  });
}
chips.forEach(([c, t, layer]) => c.addEventListener("click", () => {
  activeTag = t; activeLayer = layer;
  chips.forEach(([o]) => o.classList.remove("on"));
  c.classList.add("on"); paint();
}));
const qEl = document.getElementById("q");
qEl.addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); paint(); });
qEl.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !q) return;
  const hit = DATA.nodes.find(n =>
    (n.title + " " + n.summary).toLowerCase().includes(q));
  if (hit) { flyTo(hit.id); select(hit.id); }
});

let mmdSeq = 0;

dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

function renderMarkdown(container, text, fromId) {
  const parts = text.split(/```mermaid\n([\s\S]*?)```/);
  parts.forEach((part, i) => {
    if (!part.trim()) return;
    if (i % 2 && window.mermaid) {
      const p = el("pre", "mermaid", part);
      p.dataset.src = part;
      container.append(p);
    } else if (i % 2) {
      container.append(el("pre", "", part));
    } else {
      const d = el("div", "");
      d.innerHTML = DOMPurify.sanitize(marked.parse(part));
      d.querySelectorAll("a").forEach(a => {
        const href = a.getAttribute("href") || "";
        if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
        const target = resolveRel(fromId, href);
        if (target && (byId[target] || ALLDOCS[target] !== undefined)) {
          a.href = "#";
          a.addEventListener("click", e => { e.preventDefault();
            byId[target] ? openCard(target) : openDoc(target); });
        } else { a.removeAttribute("href"); a.style.opacity = .6; }
      });
      container.append(d);
    }
  });
  if (window.mermaid) {

(function () {
  const sel = document.getElementById("skin");
  if (!STYLES) { sel.style.display = "none"; return; }
  const sheet = document.getElementById("skinsheet");

    sheet.textContent = STYLES.css[slug];
