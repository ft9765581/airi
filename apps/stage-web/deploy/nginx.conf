# Server block for the built stage-web files.
# The nginx container loads this file as /etc/nginx/conf.d/default.conf.
# A host nginx installation can include it the same way.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The container serves plain HTTP. Caddy terminates TLS in front of it.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # Vite writes a content hash into every file name under /assets.
  # A new build writes a new name, so the browser can keep the old file.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # These files control the next build. The browser must request them again.
  location = /index.html { expires -1; }
  location = /manifest.webmanifest { expires -1; }
  location = /sw.js { expires -1; }

  # The build copies public/_headers, public/_redirects, and the HuggingFace
  # Space card into the output. nginx does not read these files, so keep them
  # off the public site.
  location ~* ^/(?:README\.md|_headers|_redirects|\.assetsignore|\.gitattributes)$ {
    return 404;
  }

  # public/_redirects sends /docs/ to the English documentation.
  # Apply the same rule when the build copies the documentation site to /docs.
  location = /docs/ { return 301 /docs/en/; }
  rewrite ^/docs/zh-hans(/.*)?$ /docs/zh-Hans$1 permanent;

  # Vue Router runs in history mode. Serve the matching file when it exists,
  # then serve the application shell for every other route.
  # /docs and /ui hold their own index.html when the build copies them here.
  location / {
    try_files $uri $uri/index.html /index.html;
  }

  # Uncomment to stop the server from sending JavaScript source maps.
  # location ~ \.map$ { return 404; }
}
