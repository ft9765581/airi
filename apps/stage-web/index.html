<!doctype html>
<!-- The interface language is Simplified Chinese. The attribute drives the
     browser's font choice, line breaking, and the "translate this page" prompt. -->
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <title>清锡医疗</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="description" content="产后呵护陪伴，随时在身边。">
    <meta name="apple-mobile-web-app-title" content="清锡医疗" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="rgb(18,18,18)" id="themeColor" />

    <!-- Open Graph Protocol -->
    <meta property="og:title" content="清锡医疗">
    <meta property="og:site_name" content="清锡医疗">
    <meta property="og:description" content="产后呵护陪伴，随时在身边。">

    <!-- Open Graph Protocol extension, Twitter cards -->
    <meta name="twitter:title" content="清锡医疗">
    <meta name="twitter:description" content="产后呵护陪伴，随时在身边。">
    <meta name="twitter:card" content="summary_large_image">
    <!-- The deployment serves one language. This runs before any module loads,
         so the i18n instance reads the value at import time instead of falling
         back to the browser language. It replaces a stored value on every load,
         which also repairs a browser that stored another language earlier. -->
    <script>
      ;(function () {
        try {
          localStorage.setItem('settings/language', 'zh-Hans')
        }
        catch {}
      })()
    </script>
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'light' || (prefersDark && setting !== 'dark'))
          document.querySelector('#themeColor')?.setAttribute('content', 'rgb(255,255,255)')
      })()
    </script>
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)
      })()
    </script>
    <script src="/assets/js/CubismSdkForWeb-5-r.3/Core/live2dcubismcore.min.js"></script>
  </head>
  <body class="font-sans">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <noscript> This website requires JavaScript to function properly. Please enable JavaScript to continue. </noscript>
  </body>
</html>
