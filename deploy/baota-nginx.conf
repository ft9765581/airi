# 宝塔站点反代配置片段。
#
# 用法：宝塔 → 网站 → 你的站点 → 设置 → 配置文件，
# 把下面所有 location 块粘贴进 server { } 里面（不要粘 server { } 本身）。
#
# 前提：docker compose 已启动，api 在 127.0.0.1:3000，auth 在 127.0.0.1:3001。

# ── 认证服务 ──────────────────────────────────────────────
# ^~ 表示按最长前缀匹配，所以 /api/auth 不会被后面的 /api/ 抢走。
# 这三组路径都归 auth 服务，写错任何一组都会导致登录 404 或无限重定向。
location ^~ /api/auth {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /auth {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /auth/callback 是前端路由，不是 auth 服务的路径。
#
# 上面的 `^~ /auth` 是前缀匹配，会把 `/auth/callback?code=...` 一起代理给 auth 服务，
# auth 服务又把它转给账号站，于是 SPA 永远拿不到 `?code=`，登录就停在中间。
# 精确匹配（location = ...）优先于 `^~` 前缀匹配，所以这一段能把它抢回来。
location = /auth/callback {
    add_header Cache-Control "no-store";
    try_files /index.html =404;
}

location ^~ /.well-known/oauth-authorization-server/api/auth {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── 资源 API ──────────────────────────────────────────────
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 上传和聊天同步可能超过默认 60 秒
    proxy_read_timeout 300s;
}

# ── WebSocket ─────────────────────────────────────────────
location ^~ /ws/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

# ── 内部端点不给公网 ──────────────────────────────────────
location ^~ /internal/ {
    return 404;
}

# ── 前端静态文件 ──────────────────────────────────────────
# 宝塔生成的那段 location / 通常已经有 try_files，确认它长这样即可。
# Vue Router 是 history 模式，刷新 /settings 这类路由要回 index.html。
location / {
    try_files $uri $uri/index.html /index.html;
}

# Vite 产物文件名带哈希，可以长缓存
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# 这三个每次构建都会变，必须回源
location = /index.html { expires -1; }
location = /manifest.webmanifest { expires -1; }
location = /sw.js { expires -1; }
