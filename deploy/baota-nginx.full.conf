# 宝塔站点完整配置（airi.bestmings.com）
#
# 用法：宝塔 → 网站 → airi.bestmings.com → 设置 → 配置文件，
# 用下面这一整段替换原来的 server { } 块，`nginx -t` 通过后重载。
#
# 重要：前端 dist 由另一个服务提供（当前是 127.0.0.1:39115）。
# 如果那个服务不在本机，把下面每一处 127.0.0.1:39115 一起换成它的 IP:端口。
#
# 相对原配置改了四处：
#   1. 删掉孤立的 `q`（它在 ssl_certificate 前面，会让 nginx 报语法错误）
#   2. 深链接回退：把静态服务的 404 转成 index.html，刷新 /nurse、/settings/account 不再 404。
#      /assets/ 和 /models/ 单独列出并关掉拦截，让缺失的静态文件保持 404
#      （否则 JS 会拿到 HTML，报 "Can't find end of central directory" 这类错）
#   3. 新增 `location = /auth/callback`，把 OIDC 回调从 ^~ /auth 手里抢回给前端
#   4. 给 /assets/ 加长缓存，给 index.html / sw.js / manifest 加 no-store
#
# 其余（/v1/ 到 vLLM、/api/ 到 3000、/api/auth 和 /ws/、/internal/ 404）保持原样。

server {
    listen 80;
    listen 443 ssl http2;
    listen 8995;
    server_name airi.bestmings.com;

    ssl_certificate     /www/server/panel/vhost/cert/airi.bestmings.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/airi.bestmings.com/privkey.pem;

    # vLLM（OpenAI 兼容）
    location /v1/ {
        proxy_pass http://127.0.0.1:39111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 账号服务（auth）。^~ 是前缀匹配，最长前缀优先，
    # 所以 /api/auth 不会被后面的 /api/ 抢走。
    location ^~ /api/auth {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /auth {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /auth/callback 是前端路由（apps/stage-web/src/pages/auth/callback.vue），
    # 负责用 ?code= 换 token。上面的 ^~ /auth 会把它一起代理给 auth 服务，
    # 前端就永远拿不到 code，登录停在中间。精确匹配优先于 ^~ 前缀。
    location = /auth/callback {
        proxy_pass http://127.0.0.1:39115;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 静态服务不认识 /auth/callback，会回 404，这里把它变成 index.html
        proxy_intercept_errors on;
        error_page 404 =200 /index.html;
        add_header Cache-Control "no-store";
    }

    location ^~ /.well-known/oauth-authorization-server/api/auth {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 资源 API（含知识库代理）
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传和聊天同步可能超过默认 60 秒
        proxy_read_timeout 300s;
    }

    # WebSocket（聊天同步）
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # 内部端点不给公网
    location ^~ /internal/ {
        return 404;
    }

    # 静态资源：缺失时必须保持 404，不能被回退成 index.html
    location /assets/ {
        proxy_pass http://127.0.0.1:39115;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Live2D 模型包在这里；缺失时必须回 404，否则 JSZip 会拿到 HTML 报错。
    location /models/ {
        proxy_pass http://127.0.0.1:39115;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    # 每次构建都会变的三个文件：不缓存
    location = /index.html {
        proxy_pass http://127.0.0.1:39115;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:39115;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:39115;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    # 其余所有请求：SPA 回退。
    # Vue Router 是 history 模式，刷新 /nurse、/settings/account 必须回 index.html。
    # 静态服务对这些路径回 404，这里把 404 变成 index.html（状态码 200）。
    location / {
        proxy_pass http://127.0.0.1:39115;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_intercept_errors on;
        error_page 404 =200 /index.html;
    }
}
